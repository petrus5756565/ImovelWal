{% extends "base.html" %}
{% block titulo %}Login — {{ site.nome }}{% endblock %}

{% block conteudo %}
<div class="login-wrap">
  <h1>Área da Corretora</h1>
  <form class="form-imovel" method="post">
    <div class="campo" style="margin-bottom:14px;">
      <label>Usuário</label>
      <input type="text" name="usuario" required autofocus>
    </div>
    <div class="campo" style="margin-bottom:18px;">
      <label>Senha</label>
      <input type="password" name="senha" required>
    </div>
    <button class="btn-primario" type="submit" style="width:100%;">Entrar</button>
  </form>
</div>
{% endblock %}
