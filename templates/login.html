{% extends "base.html" %}
{% block titulo %}Login - {{ site.name }}{% endblock %}

{% block conteudo %}
<div class="login-wrap">
    <h1>Área da Corretora</h1>
    <form class="form-imovel" method="post">
        <div class="div-class=campo" style="margin-bottom:14px;">
            <label>Usuário</label>
            <input type="text" name="usuario" required autofocus>
        </div>
        <div class="div-class=campo" style="margin-bottom:18px;">
            <label>Senha</label>
            <div style="position: relative; display: flex; align-items: center;">
                <input type="password" id="senha" name="senha" required style="width: 100%; padding-right: 40px;">
                <button type="button" id="toggleSenha" style="position: absolute; right: 10px; background: none; border: none; cursor: pointer; font-size: 18px; padding: 0;">
                    👁️
                </button>
            </div>
        </div>
        <button class="btn-primario" type="submit" style="width:100%;">Entrar</button>
    </form>
</div>

<script>
    const inputSenha = document.getElementById('senha');
    const botaoToggle = document.getElementById('toggleSenha');

    botaoToggle.addEventListener('click', function () {
        if (inputSenha.type === 'password') {
            inputSenha.type = 'text';
            botaoToggle.textContent = '🙈';
        } else {
            inputSenha.type = 'password';
            botaoToggle.textContent = '👁️';
        }
    });
</script>
{% endblock %}
